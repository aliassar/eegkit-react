version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # tsup's declaration build needs the TypeScript 5 compiler API; TS 7 drops it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
